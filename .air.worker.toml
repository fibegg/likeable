root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/likeable-worker ./cmd/likeable"
bin = "./tmp/likeable-worker"
include_dir = ["cmd", "internal"]
include_file = ["go.mod", "go.sum"]
include_ext = ["go"]
exclude_dir = ["node_modules", "dist", "data", "tmp", "internal/likeable/web-dist", ".git"]
exclude_regex = ["_test.go"]
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true
