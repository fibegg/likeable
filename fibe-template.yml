x-fibe.gg:
  variables:
    REPO_URL:
      name: Repository URL
      required: true
      default: "https://github.com/fibegg/likeable"
    REPO_BRANCH:
      name: Repository branch
      default: "likeable-launch-hardening"
    SUBDOMAIN:
      name: Subdomain
      default: "@"
    BASE_URL:
      name: Public app URL
      default: "https://likeable.lol"
    ADMIN_EMAIL:
      name: Admin email
      default: "admin@example.com"
    LIKEABLE_DEV_AUTH:
      name: Enable dev auth
      default: "0"
    BOOTSTRAP_TOKEN:
      name: One-time bootstrap token
      default: ""
    FIBE_CLI_VERSION:
      name: Fibe CLI version
      default: ""
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw ping | grep -q '^PONG$'"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  app:
    build: "."
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      fibe.gg/repo_url: "$$var__REPO_URL"
      fibe.gg/branch: "$$var__REPO_BRANCH"
      fibe.gg/source_mount: /src
      fibe.gg/dockerfile: Dockerfile
      fibe.gg/expose: external:8080
      fibe.gg/subdomain: "$$var__SUBDOMAIN"
      fibe.gg/zerodowntime: "true"
      fibe.gg/healthcheck_path: /healthz
      fibe.gg/healthcheck_interval: 30s
      fibe.gg/healthcheck_timeout: 5s
      fibe.gg/healthcheck_retries: "3"
      fibe.gg/healthcheck_start_period: 10s
    environment:
      ADDR: ":8080"
      ADMIN_EMAIL: "$$var__ADMIN_EMAIL"
      BASE_URL: "$$var__BASE_URL"
      DATABASE_PATH: /data/likeable.db
      HOME: /tmp
      LIKEABLE_DEV_AUTH: "$$var__LIKEABLE_DEV_AUTH"
      LIKEABLE_BOOTSTRAP_TOKEN: "$$var__BOOTSTRAP_TOKEN"
      FIBE_CLI_VERSION: "$$var__FIBE_CLI_VERSION"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - likeable_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 20s

volumes:
  likeable_data:
  redis_data:
